name: agentic-container

services:
  runtime:
    build:
      context: .
      args:
        FEATURES: ${FEATURES:-ssh}
        ORCA_VERSION: ${ORCA_VERSION:-latest}
    container_name: agentic-container
    restart: unless-stopped

    mem_limit: ${RUNTIME_MEM_LIMIT:-8gb}
    memswap_limit: ${RUNTIME_MEM_LIMIT:-8gb}
    cpus: ${RUNTIME_CPUS:-2}

    ports:
      - "${HOST_BIND:-127.0.0.1}:${ORCA_PORT:-6768}:${ORCA_PORT:-6768}"
      - "${HOST_BIND:-127.0.0.1}:${SSH_HOST_PORT:-2222}:22"

    environment:
      ORCA_PORT: "${ORCA_PORT:-6768}"
      ORCA_PAIRING_ADDRESS: ${ORCA_PAIRING_ADDRESS:-${HOST_BIND:-127.0.0.1}}
      ORCA_JSON: ${ORCA_JSON:-0}
      ORCA_MOBILE_PAIRING: ${ORCA_MOBILE_PAIRING:-0}
      ORCA_NO_SANDBOX: ${ORCA_NO_SANDBOX:-0}
      OPENCODE_MCP_BROWSER: ${OPENCODE_MCP_BROWSER:-0}
      OPENCODE_MCP_ANDROID: ${OPENCODE_MCP_ANDROID:-0}
      LIBGL_ALWAYS_SOFTWARE: "1"

    volumes:
      - home:/home/agent

    security_opt:
      - seccomp:unconfined

    shm_size: "1gb"

    healthcheck:
      # SSH is the one service every build carries.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/22'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  browser-mcp:
    image: mcr.microsoft.com/playwright/mcp
    profiles: [mcp-browser]
    restart: unless-stopped
    init: true
    entrypoint: ["node"]
    command: ["/app/cli.js", "--headless", "--browser", "chromium", "--no-sandbox", "--host", "0.0.0.0", "--port", "8931", "--allowed-hosts", "browser-mcp:8931"]
    mem_limit: ${BROWSER_MEM_LIMIT:-2gb}
    memswap_limit: ${BROWSER_MEM_LIMIT:-2gb}
    cpus: ${BROWSER_CPUS:-1}
    pids_limit: ${BROWSER_PIDS_LIMIT:-256}
    logging:
      driver: json-file
      options:
        max-size: ${CONTAINER_LOG_MAX_SIZE:-10m}
        max-file: ${CONTAINER_LOG_MAX_FILES:-3}
    expose:
      - "8931"
    shm_size: "1gb"

  android-emulator:
    image: ${ANDROID_EMULATOR_IMAGE:-budtmo/docker-android:emulator_14.0}
    profiles: [mcp-android]
    restart: unless-stopped
    environment:
      EMULATOR_DEVICE: ${ANDROID_EMULATOR_DEVICE:-Nexus 5}
      EMULATOR_ADDITIONAL_ARGS: ${ANDROID_EMULATOR_ARGS:--no-boot-anim -no-snapshot}
      WEB_VNC: "false"
    devices:
      - /dev/kvm:/dev/kvm
    expose:
      - "5555"
    mem_limit: ${ANDROID_MEM_LIMIT:-6gb}
    memswap_limit: ${ANDROID_MEM_LIMIT:-6gb}
    cpus: ${ANDROID_CPUS:-3}
    pids_limit: ${ANDROID_PIDS_LIMIT:-512}
    logging:
      driver: json-file
      options:
        max-size: ${CONTAINER_LOG_MAX_SIZE:-10m}
        max-file: ${CONTAINER_LOG_MAX_FILES:-3}
    shm_size: "2gb"

  android-mcp:
    image: budtmo/docker-android:mcp
    profiles: [mcp-android]
    restart: unless-stopped
    environment:
      EMULATOR_HOST: android-emulator
      EMULATOR_PORT: "5555"
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
    depends_on:
      android-emulator:
        condition: service_started
    expose:
      - "8000"
    mem_limit: ${ANDROID_MCP_MEM_LIMIT:-512m}
    memswap_limit: ${ANDROID_MCP_MEM_LIMIT:-512m}
    cpus: ${ANDROID_MCP_CPUS:-0.5}
    pids_limit: ${ANDROID_MCP_PIDS_LIMIT:-128}
    logging:
      driver: json-file
      options:
        max-size: ${CONTAINER_LOG_MAX_SIZE:-10m}
        max-file: ${CONTAINER_LOG_MAX_FILES:-3}

  # Peer-to-peer sync between this host and a local client, used to keep
  # agent skills and related config in sync across machines.
  syncthing:
    image: syncthing/syncthing
    restart: unless-stopped

    mem_limit: ${SYNCTHING_MEM_LIMIT:-512m}
    memswap_limit: ${SYNCTHING_MEM_LIMIT:-512m}
    cpus: ${SYNCTHING_CPUS:-0.5}

    ports:
      - "${HOST_BIND:-127.0.0.1}:8384:8384"
      - "${HOST_BIND:-127.0.0.1}:22000:22000/tcp"
      - "${HOST_BIND:-127.0.0.1}:22000:22000/udp"
      - "${HOST_BIND:-127.0.0.1}:21027:21027/udp"

    environment:
      PUID: "1000"
      PGID: "1000"
      STGUIADDRESS: "0.0.0.0:8384"
      STHOMEDIR: "/home/agent/.config/syncthing"
      SYNCTHING_USER: ${SYNCTHING_USER:-}
      SYNCTHING_PASSWORD: ${SYNCTHING_PASSWORD:-}

    # Syncthing has no env var for GUI credentials, so set them offline with
    # `syncthing generate` before the stock entrypoint starts serving.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ -n "$$SYNCTHING_USER" ] && [ -n "$$SYNCTHING_PASSWORD" ]; then
          printf '%s' "$$SYNCTHING_PASSWORD" | su-exec "$$PUID:$$PGID" /bin/syncthing generate \
            --home="$$STHOMEDIR" \
            --gui-user="$$SYNCTHING_USER" \
            --gui-password=-
        fi
        exec /bin/entrypoint.sh /bin/syncthing

    volumes:
      - home:/home/agent

volumes:
  home:
    name: ${VOLUME_NAME:-agentic-container-home}
